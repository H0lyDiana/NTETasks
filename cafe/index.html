<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<title>一咖舍 · 经营计算器</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
<div class="main">

  <header>
    <div class="brand">
      <div class="logo">☕</div>
      <div><h1 data-t="appName">一咖舍</h1><div class="sub" data-t="appSub">经营计算器</div></div>
      <div class="hd-right">
        <div class="hd-date"><b id="todayStr">—</b><span id="todayCat">—</span></div>
        <div class="lang-sw" id="langSw" title="中 / EN">
          <span data-l="zh" class="on">中</span><span data-l="en">EN</span>
        </div>
      </div>
    </div>
  </header>

  <div class="hero" id="hero">
    <div class="hero-top">
      <div>
        <div class="hero-lbl" data-t="heroLbl">当日风向标</div>
        <div class="hero-date">
          <input type="date" id="dateIn">
          <span id="weekday" style="color:var(--tx3)"></span>
        </div>
        <button class="auto-btn" id="btnAuto" data-t="btnAuto">回到当前生效日</button>
      </div>
      <div style="text-align:right">
        <div class="chip" id="trendChip"><span class="dot"></span><span id="trendName">—</span><span class="chip-add" id="trendAdd"></span></div>
        <div style="font-size:10px; color:var(--tx3); margin-top:7px" id="trendTip">—</div>
      </div>
    </div>
    <div class="cycle" id="cycle"></div>
    <div class="hero-note">
      <span class="hn-a"><i class="pl"></i><span data-t="noteA"></span></span>
      <span class="hn-b" id="heroNote">—</span>
    </div>
  </div>

  <div class="stats">
    <div class="st"><div class="k" data-t="statRev">小时营收</div><div class="v" id="sRev">0<span class="u">/h</span></div></div>
    <div class="st"><div class="k" data-t="statMul">人流量加成</div><div class="v" id="sMul">0<span class="u">×</span></div></div>
    <div class="st"><div class="k" data-t="statFlow">总人流量</div><div class="v" id="sFlow">0</div></div>
  </div>

  <div class="views">

    <section class="view on" id="v-earn">
      <div class="sec-t"><h2 data-t="listTitle">上架商品</h2><span id="selCount">—</span></div>
      <div class="list" id="selList"></div>

      <div class="idle-wrap hide" id="idleWrap">
        <div class="fold" id="foldBar">
          <span class="arw"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span><span id="foldText"></span>
        </div>
        <div class="list minis hide" id="idleList"></div>
      </div>

      <div class="sec-t" style="margin-top:16px"><h2 data-t="cmpTitle">各风向标对照</h2><span data-t="cmpSub"></span></div>
      <div class="tbl cmp">
        <table>
          <thead><tr><th data-t="thTrend">风向标</th><th data-t="thAdd">加成</th><th data-t="thHit">命中</th><th data-t="thRev">小时营收</th></tr></thead>
          <tbody id="cmpBody"></tbody>
        </table>
      </div>
    </section>

    <section class="view" id="v-emp">
      <div class="sec-t"><h2 data-t="empTitle">加成汇总</h2><span data-t="empSub"></span></div>
      <div class="buffrow">
        <div class="bf"><div class="bk" data-t="kFlow">人流量</div><div class="bv" id="b-flow">0</div></div>
        <div class="bf"><div class="bk" data-t="kSellAdd">售价加成</div><div class="bv" id="b-sellAdd">0</div></div>
        <div class="bf"><div class="bk" data-t="kSellPct">售价加成%</div><div class="bv" id="b-sellPct">0</div></div>
        <div class="bf"><div class="bk" data-t="kFlowPct">人流量%</div><div class="bv" id="b-flowPct">0</div></div>
      </div>

      <div class="sec-t"><h2 data-t="maxTitle">雇员编排</h2><span data-t="maxSub"></span></div>
      <div class="cols">
        <div>
          <div class="col-t"><b data-t="colUsed">已使用</b><span class="cnt" id="c-used"></span></div>
          <div class="col-in" id="col-used"></div>
        </div>
        <div>
          <div class="col-t"><b data-t="colIdle">未使用</b><span class="cnt" id="c-idle"></span></div>
          <div class="col-in" id="col-idle"></div>
        </div>
      </div>

      <div class="reset" id="btnReset" data-t="resetBtn">恢复表格默认编排</div>

      <div class="note" data-th="empNote"></div>
    </section>

    <section class="view" id="v-goods">
      <div class="sec-t"><h2 data-t="goodsTitle">商品收益总览</h2><span id="goodsCat">—</span></div>
      <div class="tbl">
        <table>
          <thead><tr><th data-t="thItem">商品</th><th data-t="thBase">基础</th><th data-t="thAdj">加成价</th><th data-t="thNo">无风向标</th><th data-t="thToday">今日收益</th></tr></thead>
          <tbody id="goodsBody"></tbody>
        </table>
      </div>
      <div class="note" data-th="goodsNote"></div>
    </section>

    <section class="view" id="v-cal">
      <div class="sec-t"><h2 data-t="calTitle">风向标日历</h2><span data-t="calSub"></span></div>
      <div class="cal-wrap">
        <div class="cal-main">
          <div class="cal" id="calHead"></div>
          <div class="cal" id="calGrid" style="margin-top:6px"></div>
        </div>
        <div class="cal-side">
          <div class="legend" id="legend"></div>
          <div class="note" data-th="calNote"></div>
        </div>
      </div>
    </section>

  </div>

</div>

  <nav>
    <div class="tab on" data-v="earn">
      <svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg><span data-t="navEarn">收益</span></div>
    <div class="tab" data-v="emp">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/><path d="M16 8.5a3 3 0 1 1 0 5.6M17.5 14.9c2.1.6 3.5 2.1 3.5 4.4"/></svg><span data-t="navEmp">雇员</span></div>
    <div class="tab" data-v="goods">
      <svg viewBox="0 0 24 24"><path d="M6 3h12l1 6H5l1-6Z"/><path d="M5 9v11h14V9"/><path d="M9 13h6"/></svg><span data-t="navGoods">商品</span></div>
    <div class="tab" data-v="cal">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="navCal">日历</span></div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
